apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-app-deployment
  labels:
    app: production-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: production-app
  template:
    metadata:
      labels:
        app: production-app
    spec:
      containers:
      - name: web-app
        image: IMAGE_PLACEHOLDER  # Jenkins will automatically replace this text with your real ECR image URL
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: production-app-service
spec:
  type: NodePort
  selector:
    app: production-app
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080